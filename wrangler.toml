#:schema node_modules/wrangler/config-schema.json
name = "rooh-ai-platform"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Serve frontend Vite SPA static assets from dist
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 1. Cloudflare D1 SQL Database Binding (Real Credentials & Bindings)
[[d1_databases]]
binding = "ROOH_D1_DATABASE"
database_name = "h"
database_id = "8480585e-443f-4ef9-b4e4-45c941c9dbf1"

[[d1_databases]]
binding = "h"
database_name = "h"
database_id = "8480585e-443f-4ef9-b4e4-45c941c9dbf1"

# 2. Cloudflare KV Namespace Binding (Real Credentials & Bindings)
[[kv_namespaces]]
binding = "ROOH_KV_CACHE"
id = "6d9110610f2c45b09c15d3f2f5dee50a"

[[kv_namespaces]]
binding = "ROOH_KV"
id = "6d9110610f2c45b09c15d3f2f5dee50a"

# 3. Cloudflare R2 Buckets Bindings (Real Bucket roohme & Bindings)
[[r2_buckets]]
binding = "ROOH_STORAGE_R2"
bucket_name = "roohme"
preview_bucket_name = "roohme"

[[r2_buckets]]
binding = "ROOH_BUCKET"
bucket_name = "roohme"

[[r2_buckets]]
binding = "roohme"
bucket_name = "roohme"

[[r2_buckets]]
binding = "rooh_reviews_bucket"
bucket_name = "roohme"

# Environment Variables & Admin Credentials
[vars]
ADMIN_EMAIL = "roohpro1@gmail.com"
ADMIN_PASSWORD = "admin123"
DEV_ADMIN_EMAIL = "roohpro1@gmail.com"
ENVIRONMENT = "production"
BASE_DOMAIN = "https://roohpro.com"
APP_BASE_PATH = "/ai"
MASTER_SITEMAP_URL = "https://roohpro.com/ai/sitemap.xml"

