name = "rooh-ai-platform"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Production Route for Master Domain & AI Application
# [routes]
# pattern = "roohpro.com/ai*"
# zone_name = "roohpro.com"

# Cloudflare R2 Bucket Bindings for Media & HTML Pages Storage
[[r2_buckets]]
binding = "ROOH_STORAGE_R2"
bucket_name = "rooh-media-vault"
preview_bucket_name = "rooh-media-vault-preview"

# Cloudflare D1 SQL Database Bindings for SEO & Archival
[[d1_databases]]
binding = "ROOH_D1_DATABASE"
database_name = "rooh_d1_db"
database_id = "ROOH_D1_DATABASE_ID_PLACEHOLDER"

# Cloudflare KV Edge Cache Bindings for Fast Prompts & Sitemaps
[[kv_namespaces]]
binding = "ROOH_KV_CACHE"
id = "ROOH_KV_CACHE_ID_PLACEHOLDER"
preview_id = "ROOH_KV_CACHE_PREVIEW_ID_PLACEHOLDER"

# Environment Variables Configuration
[vars]
ENVIRONMENT = "production"
BASE_DOMAIN = "https://roohpro.com"
APP_BASE_PATH = "/ai"
MASTER_SITEMAP_URL = "https://roohpro.com/ai/sitemap.xml"
