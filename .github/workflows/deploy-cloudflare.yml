name: Deploy Rooh AI Platform to Cloudflare

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions needed for GitHub Actions
permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Pages & Workers
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build Production Assets
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE_DOMAIN: https://roohpro.com
          VITE_APP_PATH: /ai
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: rooh-ai-platform
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

      - name: Log Deployment Notice
        run: |
          echo "🎉 Successfully built and deployed Rooh AI Platform to Cloudflare!"
          echo "🌐 Production Route: https://roohpro.com/ai"
