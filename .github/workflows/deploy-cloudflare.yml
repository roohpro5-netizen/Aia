name: Deploy Rooh AI to Cloudflare

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE_DOMAIN: https://roohpro.com
          VITE_APP_PATH: /ai

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CF_TOKEN || 'cfut_LEgbh7ocYuFJ4MxvdQamEQFephMcnCaPnLbqj66r0af23' }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || 'fa73541af4fcdd947ab78c12fe990a34' }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CF_TOKEN || 'cfut_LEgbh7ocYuFJ4MxvdQamEQFephMcnCaPnLbqj66r0af23' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || 'fa73541af4fcdd947ab78c12fe990a34' }}

      - name: Success Notification
        run: |
          echo "🎉 Build & Deployment workflow completed for project: aia"
